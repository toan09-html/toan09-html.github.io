<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Nhạc Đơn Giản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="music-player">
        <div class="cover">
            <img id="cover-img" src="https://picsum.photos/200" alt="Bìa bài hát">
        </div>

        <div class="info">
            <h2 id="title">Tên Bài Hát</h2>
            <h3 id="artist">Ca Sĩ</h3>
        </div>

        <audio id="audio"></audio>

        <div class="controls">
            <button id="prev-btn">⏮</button>
            <button id="play-btn">▶</button>
            <button id="next-btn">⏭</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
