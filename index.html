<!DOCTYPE html>
<html>
<head>
    <title>Nhạc của Trần Toàn</title>
</head>

<body style="
    margin:0;
    height:100vh;
    overflow:hidden;
    background:#0b1020;
">

    <!-- Ánh sáng 1 -->
    <div style="
        position:absolute;
        width:400px;
        height:400px;
        background:#6c63ff;
        border-radius:50%;
        filter:blur(100px);
        top:10%;
        left:10%;
        opacity:0.7;
    "></div>

    <!-- Ánh sáng 2 -->
    <div style="
        position:absolute;
        width:400px;
        height:400px;
        background:#00d4ff;
        border-radius:50%;
        filter:blur(100px);
        bottom:10%;
        right:10%;
        opacity:0.7;
    "></div>

    <!-- Ánh sáng 3 -->
    <div style="
        position:absolute;
        width:350px;
        height:350px;
        background:#ff4ecd;
        border-radius:50%;
        filter:blur(100px);
        top:40%;
        left:40%;
        opacity:0.6;
    "></div>

    <!-- Kính Liquid Glass -->
    <div style="
        position:absolute;
        width:400px;
        height:250px;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        background:rgba(255,255,255,0.08);
        backdrop-filter:blur(30px);
        border:1px solid rgba(255,255,255,0.2);
        border-radius:30px;
        box-shadow:0 20px 60px rgba(0,0,0,0.2);
    "></div>
 <center>
    <img src="images/anh 2.jpg" width="300" height="300">
     <br><br>
    <audio controls>
     <source src="./audios/haithegioi.mp3" type="audio/mpeg"> </audio>
</body>
</html>
